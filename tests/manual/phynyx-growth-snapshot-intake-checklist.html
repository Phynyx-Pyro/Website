<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Testing checklist</title>
  <style>
    :root { color-scheme: light; --ink:#182333; --muted:#526176; --line:#cbd5e1; --bg:#f5f7fb; --card:#fff; --blue:#174f9e; --focus:#f59e0b; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.48 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    a { color:var(--blue); text-underline-offset:2px; }
    :focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    .skip-link { position:absolute; top:-80px; left:12px; z-index:10; padding:8px 12px; background:#fff; }
    .skip-link:focus { top:10px; }
    .wrap { width:min(1200px,calc(100% - 36px)); margin:0 auto; }
    .hero { background:#14243c; color:#fff; padding:36px 0 32px; }
    .hero p { color:#d7e1ef; max-width:75ch; }
    .hero .eyebrow { margin:0 0 6px; color:#a9d2ff; font-size:.78rem; font-weight:750; letter-spacing:.14em; text-transform:uppercase; }
    h1,h2,h3,h4,p { margin-top:0; }
    h1 { font-size:clamp(1.8rem,3.2vw,2.8rem); line-height:1.12; margin-bottom:10px; }
    h2 { font-size:1.45rem; line-height:1.2; }
    h3 { font-size:1.16rem; line-height:1.25; }
    h4 { font-size:.85rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:7px; }
    section { scroll-margin-top:20px; }
    .stack { display:grid; gap:18px; margin:22px auto 42px; }
    .panel,.case,.page { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 2px 8px rgba(15,34,62,.04); }
    .panel { padding:20px; }
    .panel h2 { margin-bottom:12px; }
    .muted { color:var(--muted); }
    .small { font-size:.88rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:10px; }
    .stat { background:#edf3fb; border-radius:9px; padding:12px 14px; }
    .stat strong { display:block; font-size:1.55rem; line-height:1.2; }
    .stat span { color:#31435a; font-size:.85rem; }
    .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px 22px; margin:0; }
    .meta div { padding:6px 0; border-bottom:1px solid #e5eaf0; min-width:0; }
    .meta dt { font-size:.76rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .meta dd { margin:3px 0 0; overflow-wrap:anywhere; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
    .field { display:grid; gap:4px; min-width:170px; flex:1; }
    .field.search { flex:2; min-width:230px; }
    label { font-weight:650; font-size:.88rem; }
    input,select,textarea,button { font:inherit; }
    input[type="search"],select,textarea { width:100%; border:1px solid #aebdd0; border-radius:7px; background:#fff; color:var(--ink); padding:8px 10px; }
    button,.file-button { display:inline-flex; align-items:center; justify-content:center; min-height:42px; border:1px solid #9bb1ce; border-radius:7px; background:#fff; color:#153e73; font-weight:650; padding:8px 13px; cursor:pointer; }
    button:hover,.file-button:hover { background:#eaf2fd; }
    .file-button input { position:absolute; width:1px; height:1px; opacity:0; }
    .file-button:focus-within { outline:3px solid var(--focus); outline-offset:3px; }
    .buttons { display:flex; flex-wrap:wrap; gap:8px; }
    .notice { border-left:4px solid #1764b2; padding:9px 12px; background:#eaf2fd; border-radius:4px; }
    .notice.error { border-left-color:#af2637; background:#fff0f1; }
    .page { padding:20px; }
    .page-head { display:flex; flex-wrap:wrap; align-items:start; justify-content:space-between; gap:10px; }
    .page-head p { margin-bottom:3px; }
    .page-link { white-space:nowrap; }
    .pill { display:inline-block; padding:3px 9px; border-radius:100px; background:#e9eef5; color:#334762; font-size:.77rem; font-weight:700; }
    .pill.available,.pill.observed-ui { background:#e2f5ea; color:#17653d; }
    .pill.assisted,.pill.source-only { background:#fff0ca; color:#805900; }
    .pill.blocked,.pill.not-found { background:#ffe5e5; color:#9b2631; }
    .pill.unimplemented,.pill.documented-only { background:#ece8fb; color:#54389a; }
    .page-section { margin-top:19px; }
    .page-section h3 { padding-bottom:6px; border-bottom:1px solid var(--line); }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th,td { text-align:left; vertical-align:top; border-bottom:1px solid #dfe5ed; padding:9px 10px 9px 0; }
    th { color:#394a60; font-size:.76rem; text-transform:uppercase; letter-spacing:.04em; }
    td { overflow-wrap:anywhere; }
    .gap { color:#a02835; font-weight:700; }
    .status-warning { color:#a02835; font-size:.85rem; font-weight:700; margin:5px 0 0; }
    .case-list { display:grid; gap:12px; }
    .case { padding:17px; box-shadow:none; }
    .case-head { display:flex; justify-content:space-between; align-items:start; gap:12px; }
    .case h4 { color:#516176; margin:0 0 4px; }
    .case h3 { margin:0 0 8px; }
    .badges { display:flex; flex-wrap:wrap; gap:5px; }
    .case-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px 22px; margin-top:16px; }
    .case-grid > div { min-width:0; }
    .case-grid p { margin:0; }
    ol,ul { padding-left:20px; margin:0; }
    li { margin:3px 0; }
    .case-foot { display:grid; grid-template-columns:minmax(190px,250px) minmax(0,1fr); gap:14px; align-items:start; margin-top:17px; padding-top:14px; border-top:1px solid #dfe5ed; }
    .case-foot textarea { min-height:85px; resize:vertical; }
    .context-edit { min-height:55px; resize:vertical; margin-top:4px; }
    .print-note,.print-status,.print-context { display:none; white-space:pre-wrap; overflow-wrap:anywhere; }
    .source { margin:12px 0 0; font-size:.8rem; color:var(--muted); overflow-wrap:anywhere; }
    .empty { color:var(--muted); font-style:italic; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:700px) { .wrap { width:min(100% - 24px,1200px); } .hero { padding:28px 0; } .panel,.page { padding:16px; } .case-grid,.case-foot { grid-template-columns:1fr; } .case-head { display:block; } .badges { margin-top:8px; } }
    @media print { @page { margin:14mm; } body { background:#fff; color:#000; font-size:10pt; } .hero { color:#000; background:#fff; padding:0; } .hero p,.hero .eyebrow { color:#000; } .stack { margin:0; gap:10px; } .panel,.page,.case { box-shadow:none; border-color:#aaa; break-inside:avoid; } .toolbar,.buttons,.skip-link,.screen-only { display:none!important; } .print-note,.print-status,.print-context { display:block; } .page { break-before:page; } .page:first-of-type { break-before:auto; } a { color:#000; text-decoration:underline; } .pill { border:1px solid #aaa; background:#fff!important; color:#000!important; } textarea,select { display:none; } .stat { background:#fff; border:1px solid #aaa; } }
  </style>
</head>

    <nav class="panel" aria-labelledby="contents-heading"><h2 id="contents-heading">Pages</h2><ul id="contents"></ul></nav>
    <div id="pages"></div>

ut SMS consent","area":"Consent enforcement","availability":"available","availabilityReason":"The current fixture has both SMS consent fields set to Not consented.","implementation":"observed-ui","source":"CRM consent fields, completed 002a execution logs, and contact conversation inspected 2026-09-23","prerequisites":["Use a fixture with both SMS consent fields off","Allow the relevant recovery window to finish"],"steps":["Inspect all workflow execution rows after the wait","Inspect the contact conversation and provider/message record for the defined window"],"expected":["No SMS action is scheduled or executed","No provider SMS record exists for the fixture"],"observed":["Post-wait execution contained the eligibility branch, conversation-AI/status update, recovery email, and end; no SMS action executed","The contact conversation contained only the recovery email in the test window; a separate carrier-console audit was not performed"]},{"id":"ga-no-unconsented-voice","pageId":"workflow-002a-view","title":"Do not dispatch an AI voice call without voice consent","area":"Consent enforcement","availability":"available","availabilityReason":"The current fixture has AI Voice Marketing Consent set to Not consented.","implementation":"observed-ui","source":"CRM consent field, completed 002a execution logs, and contact conversation inspected 2026-09-23","prerequisites":["Use a fixture with AI Voice Marketing Consent off","Allow the relevant recovery window to finish"],"steps":["Inspect workflow rows after the wait","Inspect provider/call records for the defined window"],"expected":["No outbound voice action is scheduled or executed","No provider call record exists for the fixture"],"observed":["Post-wait execution contained no voice-call action","The contact conversation contained only the recovery email in the test window; a separate call-provider console audit was not performed"]},{"id":"ga-001-internal-fyi-delivery","pageId":"workflow-001-view","title":"Deliver both internal new-lead alerts with accurate stage language","area":"Internal notification","availability":"assisted","availabilityReason":"Andrew and Craig are the configured internal recipients.","implementation":"observed-ui","source":"Workflow 001 execution logs and action content inspected 2026-09-23","prerequisites":["Submit a controlled internal lead"],"steps":["Confirm both FYI actions execute","Open each recipient's notification center","Verify the title and body"],"expected":["Both internal notifications are present","The body says the lead started the Growth Snapshot rather than completed an assessment","Name, phone, and email resolve correctly"],"observed":["Both FYI workflow actions executed; recipient-visible delivery still needs direct notification-center confirmation"]},{"id":"ga-later-completion-no-double-intake","pageId":"workflow-001-view","title":"Avoid a second intake when the same lead later completes the assessment","area":"Duplicate prevention","availability":"available","availabilityReason":"The old Website Submission ID trigger was removed and an internal fixture can complete later steps.","implementation":"observed-ui","source":"Workflow 001 builder inspected after removal of the Contact Changed trigger","prerequisites":["Capture a lead at the first checkpoint","Record its initial Workflow 001 execution"],"steps":["Complete the remaining assessment for the same contact","Inspect CRM contact count","Inspect Workflow 001 executions and FYIs"],"expected":["The same CRM contact is updated","Completion does not create a second contact","Website Submission ID changes do not trigger a duplicate Workflow 001 intake or FYI"],"observed":["The duplicate completion trigger is absent; the completion runtime case has not yet been executed"]}]}</script>
  <script>
  (() => {
    'use strict';
    const data = JSON.parse(document.getElementById('checklist-data').textContent);
    const statuses = ['Not run','Pass','Fail','Blocked','Skipped'];
    const storageKey = `testing-checklist:v1:${JSON.stringify([data.suite.id,data.suite.generatedFrom])}`;
    const pageById = new Map(data.pages.map(page => [page.id,page]));
    const caseById = new Map(data.cases.map(test => [test.id,test]));
    const statusState = {};
    const noteState = {};
    const contextState = Object.assign(Object.create(null),data.context);
    const $ = id => document.getElementById(id);
    function node(tag, className, content) {
      const result = document.createElement(tag);
      if (className) result.className = className;
      if (content !== undefined) result.textContent = content;
      return result;
    }
    function append(parent, ...children) { children.forEach(child => parent.appendChild(child)); return parent; }
    function valueText(value) { return Array.isArray(value) ? value.join('; ') : String(value ?? ''); }
    function textList(items, ordered) {
      if (!items.length) return node('p','empty','None recorded.');
      const list = node(ordered ? 'ol' : 'ul');
      items.forEach(item => append(list,node('li','',item)));
      return list;
    }
    function pill(text, css) { return node('span',`pill ${css || ''}`,text); }
    function showMessage(message, error=false) {
      const target = $('save-message');
      target.textContent = message;
      target.className = error ? 'notice error small' : 'notice small';
    }
    function readSaved() {
      try {
        let saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
        if (saved.generatedFrom !== data.suite.generatedFrom) saved = {};
        for (const test of data.cases) {
          const result = saved.results && saved.results[test.id];
          statusState[test.id] = statuses.includes(result?.status) ? result.status : 'Not run';
          noteState[test.id] = typeof result?.note === 'string' ? result.note.slice(0,20000) : '';
        }
        for (const key of Object.keys(data.context)) {
          if (saved.context && Object.hasOwn(saved.context,key) && typeof saved.context[key] === 'string') contextState[key] = saved.context[key].slice(0,20000);
        }
      } catch (error) {
        data.cases.forEach(test => { statusState[test.id]='Not run'; noteState[test.id]=''; });
        showMessage('Saved results could not be read. Export a copy if needed before recording new results.',true);
      }
    }
    function snapshot() {
      const results = {};
      data.cases.forEach(test => { results[test.id] = {status:statusState[test.id], note:noteState[test.id]}; });
      return {schemaVersion:1, suiteId:data.suite.id, generatedFrom:data.suite.generatedFrom, exportedAt:new Date().toISOString(), context:{...contextState}, results};
    }
    function save() {
      try { localStorage.setItem(storageKey,JSON.stringify(snapshot())); }
      catch (error) { showMessage('Browser storage is unavailable or full. Export results JSON to keep your work.',true); }
    }
    function updateSummary() {
      const counts = Object.fromEntries(statuses.map(status => [status,0]));
      data.cases.forEach(test => counts[statusState[test.id]]++);
      const summary = $('summary'); summary.replaceChildren();
      [['Total tests',data.cases.length],['Pass',counts.Pass],['Fail',counts.Fail],['Blocked',counts.Blocked],['Skipped',counts.Skipped],['Not run',counts['Not run']]].forEach(([label,count]) => {
        const box=node('div','stat'); append(box,node('strong','',String(count)),node('span','',label)); summary.appendChild(box);
      });
      const covered = data.inventory.filter(item => item.testIds.length > 0).length;
      const gap = data.inventory.length - covered;
      const unmapped = data.cases.filter(test => !data.inventory.some(item => item.testIds.includes(test.id))).length;
      $('coverage-note').textContent = `${covered} of ${data.inventory.length} inventoried items link to tests; ${gap} recorded gap${gap===1?'':'s'}. ${unmapped} test${unmapped===1?'':'s'} are not linked from inventory. This is manifest coverage, not proof that the entire product was inspected.`;
    }
    function renderContext() {
      document.title = `${data.suite.title} · Testing checklist`;
      $('suite-title').textContent = data.suite.title;
      $('suite-description').textContent = data.suite.description;
      const entries = [['Suite ID',data.suite.id],['Generated from',data.suite.generatedFrom],['Scope',data.suite.scope],['Limitations',valueText(data.suite.limitations)]];
      const target = $('context'); target.replaceChildren();
      entries.forEach(([key,value]) => { const row=node('div'); append(row,node('dt','',key),node('dd','',value || 'Not recorded')); target.appendChild(row); });
      Object.keys(data.context).forEach((key,index) => {
        const row=node('div'); const term=node('dt');
        const label=node('label','',key); label.htmlFor=`context-${index}`; term.appendChild(label);
        const description=node('dd');
        const input=node('textarea','context-edit'); input.id=`context-${index}`; input.maxLength=20000; input.value=contextState[key];
        const printed=node('span','print-context',contextState[key] || 'Not recorded');
        input.addEventListener('input',() => { contextState[key]=input.value; printed.textContent=input.value || 'Not recorded'; save(); });
        append(description,input,printed); append(row,term,description); target.appendChild(row);
      });
    }
    function renderNav() {
      const select=$('page-filter'), contents=$('contents');
      data.pages.forEach(page => {
        const option=node('option','',page.title); option.value=page.id; select.appendChild(option);
        const item=node('li'); const anchor=node('a','',page.title); anchor.href=`#page-${page.id}`; item.appendChild(anchor); contents.appendChild(item);
      });
    }
    function renderInventory(pageId) {
      const items=data.inventory.filter(item => item.pageId===pageId);
      if (!items.length) return node('p','empty','No UI inventory recorded for this page.');
      const wrap=node('div','table-wrap');
      const table=node('table');
      const caption=node('caption','sr-only',`Inventoried controls and functions for ${pageById.get(pageId).title}`);
      const head=node('thead'); const row=node('tr');
      ['ID','Kind','Control or function','Test coverage','Inspection source'].forEach(label => row.appendChild(node('th','',label)));
      head.appendChild(row); append(table,caption,head);
      const body=node('tbody');
      items.forEach(item => {
        const tr=node('tr');
        append(tr,node('td','',item.id),node('td','',item.kind),node('td','',item.label));
        const coverage=node('td');
        if (item.testIds.length) {
          item.testIds.forEach((id,index) => {
            if (index) coverage.appendChild(document.createTextNode(', '));
            const link=node('a','',id); link.href=`#case-${id}`; coverage.appendChild(link);
          });
        } else coverage.appendChild(node('span','gap',`Gap: ${item.gapReason}`));
        append(tr,coverage,node('td','',item.source)); body.appendChild(tr);
      });
      table.appendChild(body); wrap.appendChild(table); return wrap;
    }
    function labeledBlock(label, content) { const block=node('div'); block.appendChild(node('h4','',label)); block.appendChild(content); return block; }
    function renderReferences(references) {
      const list=node('ul');
      references.forEach(reference => {
        const item=node('li');
        const link=node('a','',reference.label); link.href=reference.url; link.target='_blank'; link.rel='noopener noreferrer';
        item.appendChild(link);
        if (reference.note) item.appendChild(document.createTextNode(` — ${reference.note}`));
        list.appendChild(item);
      });
      return list;
    }
    function renderCase(test) {
      const article=node('article','case'); article.id=`case-${test.id}`;
      const head=node('div','case-head');
      const titleArea=node('div'); append(titleArea,node('h4','',`${test.id} · ${test.area}`),node('h3','',test.title));
      const badges=node('div','badges'); append(badges,pill(test.availability,test.availability),pill(test.implementation,test.implementation));
      append(head,titleArea,badges); article.appendChild(head);
      if (test.availabilityReason) article.appendChild(node('p','small',`Availability: ${test.availabilityReason}`));
      const grid=node('div','case-grid');
      append(grid,labeledBlock('Prerequisites',textList(test.prerequisites,false)),labeledBlock('Actions',textList(test.steps,true)),labeledBlock('Expected result',textList(test.expected,false)),labeledBlock('Observed evidence',textList(test.observed,false)));
      article.appendChild(grid);
      if (test.references?.length) {
        const block=node('div','page-section'); block.appendChild(node('h4','','Screenshots and references')); block.appendChild(renderReferences(test.references)); article.appendChild(block);
      }
      const foot=node('div','case-foot');
      const statusField=node('div','field');
      const statusLabel=node('label','',`Run status for ${test.id}`); statusLabel.htmlFor=`status-${test.id}`;
      const select=node('select'); select.id=`status-${test.id}`;
      statuses.forEach(status => { const option=node('option','',status); option.value=status; select.appendChild(option); });
      select.value=statusState[test.id];
      const printStatus=node('div','print-status',`Run status: ${statusState[test.id]}`);
      const noteWarning=node('p','status-warning'); noteWarning.setAttribute('aria-live','polite');
      const needsExplanation=() => ['Blocked','Skipped'].includes(statusState[test.id]) && !noteState[test.id].trim();
      const updateNoteWarning=() => { noteWarning.textContent=needsExplanation() ? 'Add a note explaining this status.' : ''; };
      updateNoteWarning();
      select.addEventListener('change',() => { statusState[test.id]=select.value; printStatus.textContent=`Run status: ${select.value}`; updateNoteWarning(); save(); updateSummary(); if ($('status-filter').value && !needsExplanation()) renderPages(); });
      append(statusField,statusLabel,select,printStatus,noteWarning);
      const noteField=node('div','field');
      const noteLabel=node('label','',`Tester notes for ${test.id}`); noteLabel.htmlFor=`note-${test.id}`;
      const notes=node('textarea'); notes.id=`note-${test.id}`; notes.maxLength=20000; notes.placeholder='Record evidence, defect links, dates, or why this test is blocked or skipped.'; notes.value=noteState[test.id];
      const printNote=node('div','print-note',notes.value ? `Notes: ${notes.value}` : 'Notes:');
      notes.addEventListener('input',() => { noteState[test.id]=notes.value; printNote.textContent=notes.value ? `Notes: ${notes.value}` : 'Notes:'; updateNoteWarning(); save(); if ($('status-filter').value && !needsExplanation() && statusState[test.id]!==$('status-filter').value) renderPages(); });
      append(noteField,noteLabel,notes,printNote); append(foot,statusField,noteField); article.appendChild(foot);
      article.appendChild(node('p','source',`Inspection source: ${test.source}`));
      return article;
    }
    function matchingTests(pageId) {
      const query=$('search').value.trim().toLocaleLowerCase();
      const filterStatus=$('status-filter').value;
      return data.cases.filter(test => test.pageId===pageId && (!filterStatus || statusState[test.id]===filterStatus) && (!query || [test.id,test.title,test.area,test.source,test.availabilityReason,...test.prerequisites,...test.steps,...test.expected,...test.observed,...(test.references||[]).flatMap(reference => [reference.label,reference.note])].join(' ').toLocaleLowerCase().includes(query)));
    }
    function renderPages() {
      const target=$('pages'); target.replaceChildren();
      const pageFilter=$('page-filter').value;
      let visible=0;
      data.pages.filter(page => !pageFilter || page.id===pageFilter).forEach(page => {
        const tests=matchingTests(page.id);
        if (($('search').value || $('status-filter').value) && !tests.length) return;
        visible += tests.length;
        const section=node('section','page'); section.id=`page-${page.id}`;
        const head=node('div','page-head');
        const title=node('div'); append(title,node('h2','',page.title),node('p','small muted',`Inspection: ${page.inspection}`));
        head.appendChild(title);
        if (page.url) { const link=node('a','page-link','Open page ↗'); link.href=page.url; link.target='_blank'; link.rel='noopener noreferrer'; head.appendChild(link); }
        section.appendChild(head);
        section.appendChild(node('p','source',`Page source: ${page.source}`));
        const inventoryBlock=node('div','page-section'); inventoryBlock.appendChild(node('h3','','UI inventory and coverage')); inventoryBlock.appendChild(renderInventory(page.id)); section.appendChild(inventoryBlock);
        const testsBlock=node('div','page-section'); testsBlock.appendChild(node('h3','',`Test cases (${tests.length})`));
        const list=node('div','case-list');
        if (!tests.length) list.appendChild(node('p','empty','No test cases recorded for this page.'));
        tests.forEach(test => list.appendChild(renderCase(test)));
        testsBlock.appendChild(list); section.appendChild(testsBlock); target.appendChild(section);
      });
      if (!target.childNodes.length) target.appendChild(node('p','panel empty','No tests match the current filters.'));
    }
    function exportResults() {
      const blob=new Blob([JSON.stringify(snapshot(),null,2)+'\n'],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const link=node('a'); link.href=url; link.download=`${data.suite.id}-results.json`;
      document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url),1000);
      showMessage('Results JSON downloaded. It contains your notes; review it before sharing.');
    }
    async function importResults(file) {
      if (!file) return;
      try {
        if (file.size > 5_000_000) throw new Error('File is too large.');
        const imported=JSON.parse(await file.text());
        if (imported.schemaVersion !== 1 || imported.suiteId !== data.suite.id || !imported.results || typeof imported.results !== 'object' || Array.isArray(imported.results)) throw new Error('Results JSON does not match this suite.');
        let knownResults=0;
        for (const [id,result] of Object.entries(imported.results)) {
          if (!caseById.has(id)) continue;
          if (!result || !statuses.includes(result.status) || typeof result.note !== 'string' || result.note.length > 20000) throw new Error(`Invalid result for ${id}.`);
          knownResults++;
        }
        let knownContext=0;
        if (imported.context !== undefined) {
          if (!imported.context || typeof imported.context !== 'object' || Array.isArray(imported.context)) throw new Error('Invalid context object.');
          for (const [key,value] of Object.entries(imported.context)) {
            if (!Object.hasOwn(data.context,key)) continue;
            if (typeof value !== 'string' || value.length > 20000) throw new Error(`Invalid context value for ${key}.`);
            knownContext++;
          }
        }
        const sameBuild=imported.generatedFrom === data.suite.generatedFrom;
        if (sameBuild) {
          if (!knownResults && !knownContext) throw new Error('No matching test results or context fields were found.');
          if (!window.confirm(`Merge ${knownResults} test result(s) and ${knownContext} context field(s) from this build into the current browser state?`)) return;
          for (const [id,result] of Object.entries(imported.results)) {
            if (!caseById.has(id)) continue;
            statusState[id]=result.status; noteState[id]=result.note;
          }
          if (imported.context) for (const [key,value] of Object.entries(imported.context)) if (Object.hasOwn(data.context,key)) contextState[key]=value;
          save(); renderContext(); updateSummary(); renderPages(); showMessage('Matching results and context merged and saved in this browser.');
        } else {
          const transferable=Object.entries(imported.results).filter(([id,result]) => caseById.has(id) && result.note.trim());
          if (!transferable.length) throw new Error('This file is from another or unknown build and has no matching notes to carry forward.');
          if (!window.confirm(`This file is from another or unknown build. Import ${transferable.length} matching note(s) only? Current test statuses and run context will stay unchanged.`)) return;
          const source=typeof imported.generatedFrom === 'string' ? imported.generatedFrom.slice(0,160) : 'unknown';
          for (const [id,result] of transferable) noteState[id]=(`[Prior build notes: ${source}]\n`+result.note).slice(0,20000);
          save(); renderPages(); showMessage('Prior-build notes imported. Current test statuses and run context were preserved.');
        }
      } catch (error) { showMessage(`Import failed: ${error.message}`,true); }
      finally { $('import').value=''; }
    }
    readSaved(); renderContext(); renderNav(); updateSummary(); renderPages();
    ['search','page-filter','status-filter'].forEach(id => $(id).addEventListener(id==='search'?'input':'change',renderPages));
    $('export').addEventListener('click',exportResults);
    $('import').addEventListener('change',event => importResults(event.target.files?.[0]));
    $('print').addEventListener('click',() => window.print());
    let printFilters=null;
    window.addEventListener('beforeprint',() => {
      if (printFilters) return;
      printFilters={search:$('search').value,page:$('page-filter').value,status:$('status-filter').value};
      $('search').value=''; $('page-filter').value=''; $('status-filter').value=''; renderPages();
    });
    window.addEventListener('afterprint',() => {
      if (!printFilters) return;
      $('search').value=printFilters.search; $('page-filter').value=printFilters.page; $('status-filter').value=printFilters.status;
      printFilters=null; renderPages();
    });
  })();
  </script>
</body>
